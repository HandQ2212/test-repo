<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg3)"/>

  <text x="36" y="40" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.5">CHRONOBIOLOGY &amp; THERMOREGULATION PROTOCOL • HAGHAYEGH ET AL. (2019) &amp; DRAKE ET AL. (2013)</text>
  <text x="36" y="66" fill="#F8FAFC" font-size="20" font-weight="800">24-Hour Physiological Countdown to Maximize Slow-Wave Delta Sleep</text>

  <!-- Timeline Horizontal Bar -->
  <line x1="70" y1="150" x2="830" y2="150" stroke="#3B82F6" stroke-width="4"/>

  <!-- Node 1: 7:00 AM -->
  <circle cx="95" cy="150" r="14" fill="#F59E0B" stroke="#0F172A" stroke-width="3"/>
  <text x="95" y="118" fill="#FBBF24" font-size="12" font-weight="800" text-anchor="middle">07:00 AM</text>
  <rect x="36" y="176" width="135" height="105" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="103" y="198" fill="#FDE68A" font-size="11" font-weight="800" text-anchor="middle">1. Morning Lux</text>
  <text x="103" y="216" fill="#CBD5E1" font-size="10" text-anchor="middle">10,000+ lux outdoor</text>
  <text x="103" y="232" fill="#CBD5E1" font-size="10" text-anchor="middle">light within 30m</text>
  <text x="103" y="248" fill="#94A3B8" font-size="9.5" text-anchor="middle">Anchors SCN &amp; 16h</text>
  <text x="103" y="262" fill="#94A3B8" font-size="9.5" text-anchor="middle">melatonin timer</text>

  <!-- Node 2: 1:00 PM -->
  <circle cx="272" cy="150" r="14" fill="#EF4444" stroke="#0F172A" stroke-width="3"/>
  <text x="272" y="118" fill="#F87171" font-size="12" font-weight="800" text-anchor="middle">01:00 PM (-10h)</text>
  <rect x="204" y="176" width="136" height="105" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="272" y="198" fill="#FCA5A5" font-size="11" font-weight="800" text-anchor="middle">2. Caffeine Cutoff</text>
  <text x="272" y="216" fill="#CBD5E1" font-size="10" text-anchor="middle">Half-life: 5–7 hours</text>
  <text x="272" y="232" fill="#CBD5E1" font-size="10" text-anchor="middle">Prevents A1/A2A</text>
  <text x="272" y="248" fill="#94A3B8" font-size="9.5" text-anchor="middle">adenosine blockade</text>
  <text x="272" y="262" fill="#94A3B8" font-size="9.5" text-anchor="middle">(PMID: 24235903)</text>

  <!-- Node 3: 7:30 PM -->
  <circle cx="450" cy="150" r="14" fill="#10B981" stroke="#0F172A" stroke-width="3"/>
  <text x="450" y="118" fill="#34D399" font-size="12" font-weight="800" text-anchor="middle">07:30 PM (-3.5h)</text>
  <rect x="382" y="176" width="136" height="105" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="450" y="198" fill="#6EE7B7" font-size="11" font-weight="800" text-anchor="middle">3. Final Caloric Load</text>
  <text x="450" y="216" fill="#CBD5E1" font-size="10" text-anchor="middle">Stop food &amp; alcohol</text>
  <text x="450" y="232" fill="#CBD5E1" font-size="10" text-anchor="middle">Eliminates digestive</text>
  <text x="450" y="248" fill="#94A3B8" font-size="9.5" text-anchor="middle">thermogenesis &amp;</text>
  <text x="450" y="262" fill="#94A3B8" font-size="9.5" text-anchor="middle">elevated RHR</text>

  <!-- Node 4: 9:30 PM -->
  <circle cx="628" cy="150" r="14" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
  <text x="628" y="118" fill="#7DD3FC" font-size="12" font-weight="800" text-anchor="middle">09:30 PM (-90m)</text>
  <rect x="560" y="176" width="136" height="105" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="628" y="198" fill="#BAE6FD" font-size="11" font-weight="800" text-anchor="middle">4. Warm Bath Dump</text>
  <text x="628" y="216" fill="#CBD5E1" font-size="10" text-anchor="middle">40–42.5°C for 15m</text>
  <text x="628" y="232" fill="#CBD5E1" font-size="10" text-anchor="middle">Distal vasodilation</text>
  <text x="628" y="248" fill="#94A3B8" font-size="9.5" text-anchor="middle">drops core temp 1°C</text>
  <text x="628" y="262" fill="#94A3B8" font-size="9.5" text-anchor="middle">(PMID: 31102877)</text>

  <!-- Node 5: 11:00 PM -->
  <circle cx="805" cy="150" r="14" fill="#8B5CF6" stroke="#0F172A" stroke-width="3"/>
  <text x="805" y="118" fill="#C4B5FD" font-size="12" font-weight="800" text-anchor="middle">11:00 PM (Bed)</text>
  <rect x="736" y="176" width="136" height="105" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="804" y="198" fill="#DDD6FE" font-size="11" font-weight="800" text-anchor="middle">5. Thermal Cave</text>
  <text x="804" y="216" fill="#CBD5E1" font-size="10" text-anchor="middle">Ambient: 18.3°C (65°F)</text>
  <text x="804" y="232" fill="#CBD5E1" font-size="10" text-anchor="middle">Zero blue light</text>
  <text x="804" y="248" fill="#94A3B8" font-size="9.5" text-anchor="middle">+20–35% increase in</text>
  <text x="804" y="262" fill="#94A3B8" font-size="9.5" text-anchor="middle">N3 Slow-Wave Sleep</text>

  <!-- Bottom Mechanism Box: Core Body Temperature Curve -->
  <rect x="36" y="302" width="836" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="56" y="328" fill="#E2E8F0" font-size="13" font-weight="800">Thermoregulatory Paradox: How Passive Heating Accelerates Core Temperature Drop</text>
  <text x="56" y="350" fill="#94A3B8" font-size="11.5">Warm water (40–42.5°C) dilates arteriovenous anastomoses (AVAs) in the palms and soles, flushing internal heat to the</text>
  <text x="56" y="368" fill="#94A3B8" font-size="11.5">periphery. Upon exiting into a cool room (18.3°C), core temperature plunges rapidly (-1.0°C), triggering preoptic hypothalamic</text>
  <text x="56" y="386" fill="#94A3B8" font-size="11.5">neurons to fire synchronized slow delta waves (0.5–4 Hz) and cutting sleep onset latency by 10+ minutes.</text>
  <text x="56" y="412" fill="#38BDF8" font-size="11" font-weight="700">Reference: Haghayegh et al. (2019), Sleep Medicine Reviews (Meta-analysis of 17 clinical studies, n = 5,322).</text>
</svg>