<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg2)"/>

  <text x="36" y="40" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.5">ULTRADIAN SLEEP ARCHITECTURE • XIE ET AL. (2013) SCIENCE &amp; VAN CAUTER ET AL. (2000) JAMA</text>
  <text x="36" y="66" fill="#F8FAFC" font-size="20" font-weight="800">8-Hour Hypnogram: Front-Loaded Slow-Wave Sleep vs. Back-Loaded REM</text>

  <!-- Hypnogram Chart Box -->
  <rect x="36" y="86" width="828" height="210" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  
  <!-- Stage Labels on Left -->
  <text x="95" y="118" fill="#F87171" font-size="11" font-weight="700" text-anchor="end">WAKE</text>
  <text x="95" y="155" fill="#FBBF24" font-size="11" font-weight="800" text-anchor="end">REM</text>
  <text x="95" y="200" fill="#60A5FA" font-size="11" font-weight="700" text-anchor="end">LIGHT (N1/N2)</text>
  <text x="95" y="250" fill="#818CF8" font-size="11" font-weight="800" text-anchor="end">DEEP (N3 SWS)</text>

  <!-- Grid Lines -->
  <line x1="110" y1="114" x2="836" y2="114" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="110" y1="151" x2="836" y2="151" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="110" y1="196" x2="836" y2="196" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="110" y1="246" x2="836" y2="246" stroke="#334155" stroke-dasharray="3,3"/>

  <!-- Highlight Regions: First Half (SWS Dominant) vs Second Half (REM Dominant) -->
  <rect x="110" y="96" width="360" height="170" fill="#6366F1" fill-opacity="0.08"/>
  <text x="290" y="108" fill="#A5B4FC" font-size="10.5" font-weight="700" text-anchor="middle">FIRST 4 HOURS: DEEP SWS &amp; GROWTH HORMONE SURGE</text>

  <rect x="470" y="96" width="366" height="170" fill="#F59E0B" fill-opacity="0.08"/>
  <text x="653" y="108" fill="#FCD34D" font-size="10.5" font-weight="700" text-anchor="middle">FINAL 4 HOURS: PROLONGED REM &amp; SYNAPTIC CONSOLIDATION</text>

  <!-- Hypnogram Step Path across 5 Cycles -->
  <path d="M 110,114 L 130,196 L 155,246 L 215,246 L 230,196 L 245,151 L 260,151 L 275,196 L 300,246 L 345,246 L 365,196 L 385,151 L 415,151 L 430,196 L 460,246 L 480,246 L 500,196 L 525,151 L 570,151 L 590,196 L 640,196 L 660,151 L 725,151 L 745,196 L 770,151 L 825,151 L 836,114" fill="none" stroke="#38BDF8" stroke-width="3"/>

  <!-- Highlight Deep Sleep Blocks -->
  <rect x="155" y="238" width="60" height="16" rx="4" fill="#6366F1"/>
  <rect x="300" y="238" width="45" height="16" rx="4" fill="#6366F1"/>
  <rect x="460" y="238" width="20" height="16" rx="4" fill="#6366F1"/>

  <!-- Highlight REM Blocks -->
  <rect x="245" y="143" width="15" height="16" rx="4" fill="#F59E0B"/>
  <rect x="385" y="143" width="30" height="16" rx="4" fill="#F59E0B"/>
  <rect x="525" y="143" width="45" height="16" rx="4" fill="#F59E0B"/>
  <rect x="660" y="143" width="65" height="16" rx="4" fill="#F59E0B"/>
  <rect x="770" y="143" width="55" height="16" rx="4" fill="#F59E0B"/>

  <!-- Cycle Markers -->
  <text x="195" y="282" fill="#94A3B8" font-size="10.5" font-weight="700" text-anchor="middle">Cycle 1 (90m)</text>
  <text x="345" y="282" fill="#94A3B8" font-size="10.5" font-weight="700" text-anchor="middle">Cycle 2 (90m)</text>
  <text x="500" y="282" fill="#94A3B8" font-size="10.5" font-weight="700" text-anchor="middle">Cycle 3 (90m)</text>
  <text x="655" y="282" fill="#94A3B8" font-size="10.5" font-weight="700" text-anchor="middle">Cycle 4 (90m)</text>
  <text x="790" y="282" fill="#94A3B8" font-size="10.5" font-weight="700" text-anchor="middle">Cycle 5</text>

  <!-- Bottom Comparison Cards -->
  <rect x="36" y="312" width="404" height="122" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="56" y="338" fill="#A5B4FC" font-size="13" font-weight="800">DEEP SLEEP (NREM N3) • 15–20% OF NIGHT (70–110 MIN)</text>
  <text x="56" y="360" fill="#E2E8F0" font-size="11.5">• EEG Signature: High-voltage slow delta waves (0.5–4 Hz)</text>
  <text x="56" y="380" fill="#E2E8F0" font-size="11.5">• Glymphatic System: ~60% interstitial expansion clears β-amyloid</text>
  <text x="56" y="400" fill="#E2E8F0" font-size="11.5">• Endocrine: 70% of daily Growth Hormone (GH) secreted (PMID: 10938176)</text>

  <rect x="460" y="312" width="404" height="122" rx="12" fill="#271705" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="338" fill="#FCD34D" font-size="13" font-weight="800">REM SLEEP (PARADOXICAL) • 20–25% OF NIGHT (90–120 MIN)</text>
  <text x="480" y="360" fill="#E2E8F0" font-size="11.5">• EEG Signature: Desynchronized theta/beta waves + skeletal atonia</text>
  <text x="480" y="380" fill="#E2E8F0" font-size="11.5">• Emotional Reset: Amygdala reprocessing in zero-norepinephrine state</text>
  <text x="480" y="400" fill="#E2E8F0" font-size="11.5">• Vulnerable to: Late alcohol intake &amp; early alarm clock truncation</text>
</svg>