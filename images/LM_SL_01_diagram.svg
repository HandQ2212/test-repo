<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="hammockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg1)"/>
  
  <!-- Header -->
  <text x="36" y="42" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.5">CLINICAL BIOMETRIC TELEMETRY • BEATTIE ET AL. (2017) &amp; AASM GUIDELINES</text>
  <text x="36" y="68" fill="#F8FAFC" font-size="20" font-weight="800">Multi-Parametric Sleep Score Architecture &amp; Nocturnal Dipping</text>

  <!-- Left Panel: 100-Point Algorithmic Breakdown -->
  <rect x="36" y="92" width="380" height="332" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="56" y="122" fill="#E2E8F0" font-size="14" font-weight="700">100-Point Algorithmic Weighting</text>
  
  <!-- Pillar 1: 50 pts -->
  <rect x="56" y="142" width="340" height="72" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="72" y="166" fill="#60A5FA" font-size="13" font-weight="800">1. SLEEP DURATION &amp; EFFICIENCY</text>
  <text x="336" y="166" fill="#60A5FA" font-size="15" font-weight="800" text-anchor="end">50 pts</text>
  <text x="72" y="186" fill="#94A3B8" font-size="11">Total Time Asleep vs. Personalized 7–9h Baseline</text>
  <rect x="72" y="196" width="280" height="6" rx="3" fill="#1E293B"/>
  <rect x="72" y="196" width="245" height="6" rx="3" fill="#3B82F6"/>

  <!-- Pillar 2: 25 pts -->
  <rect x="56" y="226" width="340" height="72" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="72" y="250" fill="#A78BFA" font-size="13" font-weight="800">2. DEEP (N3) &amp; REM ARCHITECTURE</text>
  <text x="336" y="250" fill="#A78BFA" font-size="15" font-weight="800" text-anchor="end">25 pts</text>
  <text x="72" y="270" fill="#94A3B8" font-size="11">SWS (15–20%) &amp; REM (20–25%) Stage Proportions</text>
  <rect x="72" y="280" width="280" height="6" rx="3" fill="#1E293B"/>
  <rect x="72" y="280" width="220" height="6" rx="3" fill="#8B5CF6"/>

  <!-- Pillar 3: 25 pts -->
  <rect x="56" y="310" width="340" height="72" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="72" y="334" fill="#34D399" font-size="13" font-weight="800">3. AUTONOMIC RESTORATION (PPG)</text>
  <text x="336" y="334" fill="#34D399" font-size="15" font-weight="800" text-anchor="end">25 pts</text>
  <text x="72" y="354" fill="#94A3B8" font-size="11">% Sleep with HR Below Daytime Resting Baseline</text>
  <rect x="72" y="364" width="280" height="6" rx="3" fill="#1E293B"/>
  <rect x="72" y="364" width="235" height="6" rx="3" fill="#10B981"/>

  <text x="56" y="406" fill="#64748B" font-size="10.5">Validation: Cohen's κ = 0.52 vs. Gold-Standard PSG (PMID: 29087960)</text>

  <!-- Right Panel: Nocturnal Heart Rate Curve Comparison -->
  <rect x="436" y="92" width="428" height="332" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="456" y="122" fill="#E2E8F0" font-size="14" font-weight="700">Nocturnal Heart Rate Morphology (8-Hour Window)</text>
  <text x="456" y="140" fill="#94A3B8" font-size="11">Comparison of Optimal Parasympathetic Dip vs. Stress/Alcohol Curve</text>

  <!-- Graph Axes -->
  <line x1="486" y1="165" x2="486" y2="345" stroke="#475569" stroke-width="1"/>
  <line x1="486" y1="345" x2="836" y2="345" stroke="#475569" stroke-width="1"/>
  
  <!-- Y-Axis Labels (BPM) -->
  <text x="478" y="175" fill="#64748B" font-size="10" text-anchor="end">75 bpm</text>
  <text x="478" y="230" fill="#F59E0B" font-size="10" font-weight="700" text-anchor="end">62 bpm</text>
  <text x="478" y="285" fill="#64748B" font-size="10" text-anchor="end">54 bpm</text>
  <text x="478" y="340" fill="#64748B" font-size="10" text-anchor="end">46 bpm</text>

  <!-- Daytime RHR Baseline Dashed Line -->
  <line x1="486" y1="226" x2="836" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="832" y="219" fill="#F59E0B" font-size="10" font-weight="700" text-anchor="end">Daytime RHR Baseline (62 bpm)</text>

  <!-- Non-Dipping Stress / Late Meal Curve (Red) -->
  <path d="M 486,180 Q 560,190 640,210 T 760,235 L 836,240" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="720" y="196" fill="#F87171" font-size="10.5" font-weight="700">Elevated / Non-Dipping (Score: 64)</text>

  <!-- Optimal Hammock Curve (Cyan/Green) -->
  <path d="M 486,220 C 530,295 600,325 660,320 C 720,315 790,285 836,235 L 836,345 L 486,345 Z" fill="url(#hammockGrad)"/>
  <path d="M 486,220 C 530,295 600,325 660,320 C 720,315 790,285 836,235" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="645" cy="321" r="5" fill="#38BDF8"/>
  <text x="645" y="305" fill="#38BDF8" font-size="11" font-weight="800" text-anchor="middle">Optimal "Hammock" Nadir: 49 bpm (Score: 91)</text>

  <!-- X-Axis Labels -->
  <text x="490" y="364" fill="#94A3B8" font-size="10">11 PM</text>
  <text x="575" y="364" fill="#94A3B8" font-size="10">1 AM</text>
  <text x="660" y="364" fill="#94A3B8" font-size="10">3 AM</text>
  <text x="745" y="364" fill="#94A3B8" font-size="10">5 AM</text>
  <text x="815" y="364" fill="#94A3B8" font-size="10">7 AM</text>

  <!-- Legend -->
  <circle cx="468" cy="396" r="5" fill="#38BDF8"/>
  <text x="480" y="400" fill="#CBD5E1" font-size="11">&gt;85% Time Below Daytime RHR (High Vagal Restoration)</text>
</svg>