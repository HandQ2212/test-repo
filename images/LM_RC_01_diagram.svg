<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062019"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg5)"/>

  <text x="36" y="40" fill="#6EE7B7" font-size="11" font-weight="700" letter-spacing="1.5">CARDIAC AUTONOMIC ELECTROPHYSIOLOGY • SHAFFER &amp; GINSBERG (2017) &amp; PLEWS ET AL. (2013)</text>
  <text x="36" y="66" fill="#F8FAFC" font-size="20" font-weight="800">Heart Rate Variability (RMSSD): Millisecond R-R Interval Dynamics at 60 BPM</text>

  <!-- Top Track: High HRV (Parasympathetic / Vagal Dominance) -->
  <rect x="36" y="88" width="828" height="162" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="116" fill="#34D399" font-size="13.5" font-weight="800">STATE A: HIGH HRV (RMSSD = 92 ms) — PARASYMPATHETIC VAGAL READINESS (60 BPM)</text>
  <text x="56" y="134" fill="#94A3B8" font-size="11">Rapid acetylcholine release &amp; cholinesterase breakdown at the sinoatrial (SA) node creates dynamic beat-to-beat variance</text>

  <!-- ECG Waveform A (Variable R-R intervals: 820ms, 1140ms, 910ms, 1130ms) -->
  <path d="M 60,205 L 110,205 L 118,195 L 126,205 L 138,205 L 143,215 L 150,148 L 157,225 L 164,205 L 185,205 Q 198,188 212,205
           L 270,205 L 278,195 L 286,205 L 298,205 L 303,215 L 310,148 L 317,225 L 324,205 L 345,205 Q 358,188 372,205
           L 485,205 L 493,195 L 501,205 L 513,205 L 518,215 L 525,148 L 532,225 L 539,205 L 560,205 Q 573,188 587,205
           L 655,205 L 663,195 L 671,205 L 683,205 L 688,215 L 695,148 L 702,225 L 709,205 L 730,205 Q 743,188 757,205 L 835,205"
        fill="none" stroke="#10B981" stroke-width="2.5"/>

  <!-- R-R Interval Dimension Arrows Track A -->
  <line x1="150" y1="156" x2="310" y2="156" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="230" y="172" fill="#38BDF8" font-size="12" font-weight="800" text-anchor="middle">R-R₁ = 820 ms</text>

  <line x1="310" y1="156" x2="525" y2="156" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="417" y="172" fill="#38BDF8" font-size="12" font-weight="800" text-anchor="middle">R-R₂ = 1,140 ms (+320 ms)</text>

  <line x1="525" y1="156" x2="695" y2="156" stroke="#38BDF8" font-width="1.5" stroke-dasharray="3,3"/>
  <text x="610" y="172" fill="#38BDF8" font-size="12" font-weight="800" text-anchor="middle">R-R₃ = 910 ms (-230 ms)</text>

  <!-- Bottom Track: Low HRV (Sympathetic Dominance) -->
  <rect x="36" y="268" width="828" height="162" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="56" y="296" fill="#F87171" font-size="13.5" font-weight="800">STATE B: LOW HRV (RMSSD = 21 ms) — SYMPATHETIC OVERREACHING / STRESS (60 BPM)</text>
  <text x="56" y="314" fill="#94A3B8" font-size="11">Epinephrine &amp; norepinephrine lock the sinoatrial node into a rigid, metronomic rhythm despite identical 60 BPM heart rate</text>

  <!-- ECG Waveform B (Rigid R-R intervals: 1000ms, 998ms, 1002ms) -->
  <path d="M 60,385 L 110,385 L 118,375 L 126,385 L 138,385 L 143,395 L 150,328 L 157,405 L 164,385 L 185,385 Q 198,368 212,385
           L 300,385 L 308,375 L 316,385 L 328,385 L 333,395 L 340,328 L 347,405 L 354,385 L 375,385 Q 388,368 402,385
           L 490,385 L 498,375 L 506,385 L 518,385 L 523,395 L 530,328 L 537,405 L 544,385 L 565,385 Q 578,368 592,385
           L 680,385 L 688,375 L 696,385 L 708,385 L 713,395 L 720,328 L 727,405 L 734,385 L 755,385 Q 768,368 782,385 L 835,385"
        fill="none" stroke="#EF4444" stroke-width="2.5"/>

  <line x1="150" y1="336" x2="340" y2="336" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="245" y="352" fill="#FCA5A5" font-size="12" font-weight="800" text-anchor="middle">R-R₁ = 1,000 ms</text>

  <line x1="340" y1="336" x2="530" y2="336" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="435" y="352" fill="#FCA5A5" font-size="12" font-weight="800" text-anchor="middle">R-R₂ = 998 ms (-2 ms)</text>

  <line x1="530" y1="336" x2="720" y2="336" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="625" y="352" fill="#FCA5A5" font-size="12" font-weight="800" text-anchor="middle">R-R₃ = 1,002 ms (+4 ms)</text>
</svg>