<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#27121B"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" rx="16" fill="url(#bg4)"/>

  <text x="36" y="40" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.5">NEUROBEHAVIORAL DOSE-RESPONSE • VAN DONGEN ET AL. (2003) SLEEP &amp; SPIEGEL ET AL. (1999) THE LANCET</text>
  <text x="36" y="66" fill="#F8FAFC" font-size="20" font-weight="800">14-Day Cumulative Cognitive Impairment vs. Subjective Sleepiness Blindness</text>

  <!-- Left Chart: PVT Behavioral Lapses -->
  <rect x="36" y="90" width="490" height="338" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="56" y="120" fill="#F8FAFC" font-size="13.5" font-weight="700">Objective Psychomotor Vigilance Task (PVT) Lapses</text>
  <text x="56" y="138" fill="#94A3B8" font-size="11">Cumulative attentional failures across 14 days of sleep restriction</text>

  <!-- Axes -->
  <line x1="86" y1="165" x2="86" y2="365" stroke="#475569" stroke-width="1.5"/>
  <line x1="86" y1="365" x2="496" y2="365" stroke="#475569" stroke-width="1.5"/>

  <!-- Y Labels -->
  <text x="76" y="175" fill="#EF4444" font-size="10" font-weight="700" text-anchor="end">16 Lapses</text>
  <text x="76" y="238" fill="#F59E0B" font-size="10" font-weight="700" text-anchor="end">10 Lapses</text>
  <text x="76" y="300" fill="#94A3B8" font-size="10" text-anchor="end">5 Lapses</text>
  <text x="76" y="362" fill="#10B981" font-size="10" font-weight="700" text-anchor="end">Baseline</text>

  <!-- Threshold Line: Equivalent to 24h-48h Total Deprivation -->
  <line x1="86" y1="225" x2="496" y2="225" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="492" y="218" fill="#FCA5A5" font-size="9.5" font-weight="700" text-anchor="end">Equivalent to 24h Continuous Zero-Sleep</text>

  <!-- 4h Group Curve (Red) -->
  <path d="M 86,355 L 144,325 L 202,290 L 260,255 L 318,220 L 376,192 L 434,175 L 490,165" fill="none" stroke="#EF4444" stroke-width="3"/>
  <text x="415" y="162" fill="#F87171" font-size="11" font-weight="800">4h / Night Group</text>

  <!-- 6h Group Curve (Amber) -->
  <path d="M 86,355 L 144,340 L 202,318 L 260,295 L 318,270 L 376,248 L 434,232 L 490,222" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <text x="415" y="248" fill="#FBBF24" font-size="11" font-weight="800">6h / Night Group</text>

  <!-- Subjective Sleepiness Curve (Dashed Purple - Plateaus!) -->
  <path d="M 86,355 L 144,320 L 202,305 L 260,300 L 318,298 L 376,296 L 434,295 L 490,295" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="380" y="314" fill="#C4B5FD" font-size="10.5" font-weight="700">Subjective Feeling ("I feel fine")</text>

  <!-- 8h Control Curve (Green) -->
  <path d="M 86,355 L 202,353 L 318,354 L 490,350" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <text x="420" y="343" fill="#34D399" font-size="11" font-weight="700">8h Control Group</text>

  <!-- X Labels -->
  <text x="86" y="384" fill="#94A3B8" font-size="10">Day 1</text>
  <text x="195" y="384" fill="#94A3B8" font-size="10">Day 4</text>
  <text x="295" y="384" fill="#94A3B8" font-size="10">Day 7</text>
  <text x="395" y="384" fill="#94A3B8" font-size="10">Day 10</text>
  <text x="470" y="384" fill="#94A3B8" font-size="10">Day 14</text>

  <text x="56" y="412" fill="#64748B" font-size="10">Source: Van Dongen et al. (2003), SLEEP, 26(2):117-126 (PMID: 12683469)</text>

  <!-- Right Panel: Endocrine & Metabolic Toll -->
  <rect x="546" y="90" width="318" height="338" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="566" y="120" fill="#F8FAFC" font-size="13.5" font-weight="700">Systemic Cost of 6-Day Debt</text>
  <text x="566" y="138" fill="#94A3B8" font-size="10.5">Spiegel et al. (1999), The Lancet (PMID: 10543671)</text>

  <rect x="566" y="156" width="278" height="68" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="580" y="178" fill="#F87171" font-size="12" font-weight="800">-40% Glucose Clearance Rate</text>
  <text x="580" y="196" fill="#CBD5E1" font-size="10.5">Insulin sensitivity drops to pre-diabetic</text>
  <text x="580" y="211" fill="#CBD5E1" font-size="10.5">levels after 6 nights of 4h sleep.</text>

  <rect x="566" y="236" width="278" height="68" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="580" y="258" fill="#FBBF24" font-size="12" font-weight="800">Elevated Evening Cortisol (p=0.0001)</text>
  <text x="580" y="276" fill="#CBD5E1" font-size="10.5">HPA-axis hyperarousal blunts nocturnal</text>
  <text x="580" y="291" fill="#CBD5E1" font-size="10.5">vagal recovery and thyroid TSH output.</text>

  <rect x="566" y="316" width="278" height="92" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="580" y="338" fill="#38BDF8" font-size="12" font-weight="800">Optimal Repayment Ratio: 20–30%</text>
  <text x="580" y="356" fill="#CBD5E1" font-size="10.5">Repay via +60–90 min earlier bedtime</text>
  <text x="580" y="371" fill="#CBD5E1" font-size="10.5">+ 20m early afternoon nap. Keep wake</text>
  <text x="580" y="386" fill="#CBD5E1" font-size="10.5">time fixed within ±45m (PMID: 30827891).</text>
</svg>