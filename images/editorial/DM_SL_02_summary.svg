      <title id="title">Nợ ngủ và ngủ bù cuối tuần: điều gì giúp phục hồi? / Sleep debt and weekend catch-up sleep</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#ebeffa"/><text x="60" y="76.0" font-size="29" fill="#293d72">Nợ ngủ và ngủ bù cuối tuần: điều gì giúp phục hồi?</text><text x="62" y="164" font-size="19" fill="#293d72">TÓM TẮT / SUMMARY • DM_SL_02 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#293d72">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Nợ ngủ tích lũy khi thời gian ngủ liên tục ít</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">hơn nhu cầu.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Sleep debt builds when sleep repeatedly falls</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">short of need.</text><path d="M640 276v175" stroke="#293d72" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#293d72">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Chọn giờ thức có thể duy trì, rồi dành thời</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">gian lên giường sớm hơn khi đang thiếu ngủ.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Choose a sustainable waking time and allow an</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">earlier bedtime when short of sleep.</text><path d="M640 566v175" stroke="#293d72" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#293d72">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không quy đổi mỗi giờ thiếu ngủ thành một số</text>
