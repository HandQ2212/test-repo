<text x="675" y="907.8" font-size="21" fill="#183c3b">formula.</text><path d="M640 856v175" stroke="#293d72" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#293d72">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#293d72">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
