<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Rối loạn cương: dấu hiệu nên được đánh giá toàn diện / Erectile dysfunction and whole-person assessment</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#eef1fb"/><text x="60" y="76.0" font-size="29" fill="#364d83">Rối loạn cương: dấu hiệu nên được đánh giá toàn diện</text><text x="62" y="164" font-size="19" fill="#364d83">TÓM TẮT / SUMMARY • MW_SXH_02 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#364d83">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Khó đạt hoặc duy trì cương có thể liên quan</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">mạch máu, thần kinh, thuốc, hormone và yếu tố</text>
<text x="80" y="357.6" font-size="21" fill="#183c3b">tâm lý.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Erection difficulties can involve circulation,</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">nerves, medicines, hormones and psychological</text>
<text x="675" y="357.6" font-size="21" fill="#183c3b">factors.</text><path d="M640 276v175" stroke="#364d83" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#364d83">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Ghi thời điểm bắt đầu, hoàn cảnh, thuốc và</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">triệu chứng khác.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Note onset, context, medicines and other</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">symptoms.</text><path d="M640 566v175" stroke="#364d83" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#364d83">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Rối loạn cương không có nghĩa chắc sắp bị nhồi</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">máu cơ tim, và không phải mọi trường hợp đều do</text>
<text x="80" y="937.6" font-size="21" fill="#183c3b">testosterone thấp.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">ED does not mean a heart attack is imminent or</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">that testosterone is always low.</text><path d="M640 856v175" stroke="#364d83" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#364d83">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#364d83">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
