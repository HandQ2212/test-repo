<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Tranh luận ít gây tổn thương hơn: tạm dừng và quay lại vấn đề / Managing disagreements with less harm</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#eef1fb"/><text x="60" y="76.0" font-size="29" fill="#364d83">Tranh luận ít gây tổn thương hơn: tạm dừng và quay lại vấn đề</text><text x="62" y="164" font-size="19" fill="#364d83">TÓM TẮT / SUMMARY • MW_REL_05 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#364d83">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Bất đồng là điều có thể xảy ra trong quan hệ.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Disagreement can occur in relationships.</text><path d="M640 276v175" stroke="#364d83" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#364d83">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Gợi ý thực hành: thống nhất tín hiệu xin nghỉ,</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">thời điểm quay lại và chỉ bàn một vấn đề cụ</text>
<text x="80" y="647.6" font-size="21" fill="#183c3b">thể.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Practice suggestion: agree a pause signal and</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">return time and address one issue.</text><path d="M640 566v175" stroke="#364d83" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#364d83">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Khoảng nghỉ không được dùng như phạt im lặng</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">hoặc né tránh vô thời hạn.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">A pause should not become punitive silence or</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">indefinite avoidance.</text><path d="M640 856v175" stroke="#364d83" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#364d83">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#364d83">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
