<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Tiền mãn kinh và mãn kinh: nhận biết và chọn cách chăm sóc / Perimenopause and menopause: symptoms and care</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#fbeef6"/><text x="60" y="76.0" font-size="29" fill="#843d67">Tiền mãn kinh và mãn kinh: nhận biết và chọn cách chăm sóc</text><text x="62" y="164" font-size="19" fill="#843d67">TÓM TẮT / SUMMARY • WH_30 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#843d67">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Chu kỳ thay đổi, bốc hỏa, khó ngủ và khô âm đạo</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">có thể xuất hiện trong giai đoạn chuyển tiếp.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Changing periods, hot flushes, sleep</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">difficulties and vaginal dryness can occur</text>
<text x="675" y="357.6" font-size="21" fill="#183c3b">during the transition.</text><path d="M640 276v175" stroke="#843d67" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#843d67">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Ghi triệu chứng chính và mục tiêu điều trị.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Record your main symptoms and care priorities.</text><path d="M640 566v175" stroke="#843d67" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#843d67">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không dùng nhiệt độ da hay một kết quả hormone</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">đơn lẻ để tự xác nhận giai đoạn.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">Skin temperature or one hormone result cannot</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">automatically establish the stage.</text><path d="M640 856v175" stroke="#843d67" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#843d67">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#843d67">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
