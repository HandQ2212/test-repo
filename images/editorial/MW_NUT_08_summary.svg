<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Bù nước khi vận động: đáp ứng nhu cầu thay vì ép một công thức / Hydration during activity</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#eef1fb"/><text x="60" y="76.0" font-size="29" fill="#364d83">Bù nước khi vận động: đáp ứng nhu cầu thay vì ép một công thức</text><text x="62" y="164" font-size="19" fill="#364d83">TÓM TẮT / SUMMARY • MW_NUT_08 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#364d83">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Nhu cầu dịch phụ thuộc thời tiết, thời gian vận</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">động, mồ hôi, thức ăn và bệnh nền.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Fluid needs depend on weather, activity</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">duration, sweating, food and health.</text><path d="M640 276v175" stroke="#364d83" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#364d83">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Mang nước khi vận động và điều chỉnh theo khát,</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">điều kiện cùng hướng dẫn riêng nếu có.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Have water available and adjust to thirst,</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">conditions and individual advice.</text><path d="M640 566v175" stroke="#364d83" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#364d83">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không có một công thức ml/kg hay mức giảm 2%</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">bảo đảm dự báo hiệu suất ở tất cả.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">No single ml/kg formula or 2% loss threshold</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">predicts everyone&#x27;s performance.</text><path d="M640 856v175" stroke="#364d83" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#364d83">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#364d83">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
