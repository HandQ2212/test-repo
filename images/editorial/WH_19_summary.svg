      <title id="title">Khó ngủ trước kỳ kinh: chăm sóc triệu chứng, không chạy theo REM / Sleep difficulties before your period</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#fbeef6"/><text x="60" y="76.0" font-size="29" fill="#843d67">Khó ngủ trước kỳ kinh: chăm sóc triệu chứng, không chạy theo REM</text><text x="62" y="164" font-size="19" fill="#843d67">TÓM TẮT / SUMMARY • WH_19 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#843d67">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Khó ngủ có thể là một phần của PMS, đồng thời</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">đau, môi trường và stress cũng ảnh hưởng.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Sleep problems can occur with PMS, while pain,</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">environment and stress also matter.</text><path d="M640 276v175" stroke="#843d67" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#843d67">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Ghi lịch ngủ và triệu chứng qua ít nhất hai chu</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">kỳ.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Track sleep and symptoms for at least two</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">cycles.</text><path d="M640 566v175" stroke="#843d67" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#843d67">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không có nhiệt độ phòng duy nhất phù hợp mọi</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">người hoặc lời hứa làm mát sẽ khôi phục REM.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">No exact room temperature suits everyone or</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">guarantees restored REM.</text><path d="M640 856v175" stroke="#843d67" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#843d67">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#843d67">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
