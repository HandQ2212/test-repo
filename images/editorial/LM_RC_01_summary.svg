<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">HRV là gì và nên đọc thế nào trên thiết bị đeo? / How to read heart rate variability</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#e8f5ef"/><text x="60" y="76.0" font-size="29" fill="#126453">HRV là gì và nên đọc thế nào trên thiết bị đeo?</text><text x="62" y="164" font-size="19" fill="#126453">TÓM TẮT / SUMMARY • LM_RC_01 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#126453">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">HRV mô tả sự thay đổi khoảng thời gian giữa các</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">nhịp tim, không phải nhịp tim trung bình.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">HRV describes variation in intervals between</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">heartbeats, rather than average pulse.</text><path d="M640 276v175" stroke="#126453" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#126453">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">So với nền của chính bạn trên cùng thiết bị và</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">cùng điều kiện.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Compare with your own baseline on the same</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">device under similar conditions.</text><path d="M640 566v175" stroke="#126453" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#126453">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">HRV cao hơn không luôn tốt hơn.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">Higher is not always better.</text><path d="M640 856v175" stroke="#126453" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#126453">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#126453">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
