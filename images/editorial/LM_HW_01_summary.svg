<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Điểm stress của đồng hồ nói được gì? / What a wearable stress score can tell you</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#e7f4fa"/><text x="60" y="76.0" font-size="29" fill="#145b75">Điểm stress của đồng hồ nói được gì?</text><text x="62" y="164" font-size="19" fill="#145b75">TÓM TẮT / SUMMARY • LM_HW_01 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#145b75">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Một số thiết bị suy đoán trạng thái kích hoạt</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">sinh lý từ nhịp tim, HRV, chuyển động hoặc điện</text>
<text x="80" y="357.6" font-size="21" fill="#183c3b">dẫn da.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Some wearables infer physiological arousal from</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">pulse, HRV, movement or skin conductance.</text><path d="M640 276v175" stroke="#145b75" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#145b75">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Khi thấy điểm bất thường, ghi bạn đang làm gì</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">và cảm thấy ra sao.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Note what you were doing and how you felt when</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">the score changed.</text><path d="M640 566v175" stroke="#145b75" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#145b75">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Cách định nghĩa và hướng điểm tốt/xấu khác nhau</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">giữa hãng.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">Definitions and score directions vary by brand.</text><path d="M640 856v175" stroke="#145b75" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#145b75">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#145b75">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
