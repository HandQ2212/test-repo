<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Khi nào nên xét nghiệm testosterone? / When testosterone testing is appropriate</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#eef1fb"/><text x="60" y="76.0" font-size="29" fill="#364d83">Khi nào nên xét nghiệm testosterone?</text><text x="62" y="164" font-size="19" fill="#364d83">TÓM TẮT / SUMMARY • MW_SXH_08 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#364d83">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Hướng dẫn không khuyến nghị sàng lọc đại trà</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">testosterone ở người không triệu chứng.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Guidelines do not recommend routine</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">testosterone screening in asymptomatic men.</text><path d="M640 276v175" stroke="#364d83" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#364d83">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Trao đổi triệu chứng cụ thể, thời điểm khởi</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">phát, thuốc và bệnh gần đây.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Discuss symptoms, onset, medicines and recent</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">illness.</text><path d="M640 566v175" stroke="#364d83" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#364d83">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không đặt chẩn đoán từ một kết quả hoặc một</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">khoảng tham chiếu trên mạng.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">One result or an online reference interval</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">cannot establish diagnosis.</text><path d="M640 856v175" stroke="#364d83" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#364d83">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#364d83">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
