<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Đồng hồ báo ít ngủ sâu: khi nào cần chú ý? / When your watch reports little deep sleep</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#ebeffa"/><text x="60" y="76.0" font-size="29" fill="#293d72">Đồng hồ báo ít ngủ sâu: khi nào cần chú ý?</text><text x="62" y="164" font-size="19" fill="#293d72">TÓM TẮT / SUMMARY • DM_SL_01 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#293d72">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Thời gian ngủ sâu có thể giảm theo tuổi và thay</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">đổi tự nhiên giữa các đêm.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Deep sleep changes with age and between nights.</text><path d="M640 276v175" stroke="#293d72" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#293d72">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Theo dõi thời gian ngủ tổng, mức tỉnh táo và</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">lịch ngủ trong một đến hai tuần.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Track total sleep, alertness and timing for one</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">to two weeks.</text><path d="M640 566v175" stroke="#293d72" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#293d72">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không có mức phần trăm ngủ sâu tối ưu duy nhất</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">cho mọi người.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">There is no universal ideal deep-sleep</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">percentage.</text><path d="M640 856v175" stroke="#293d72" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#293d72">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#293d72">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
