<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Chu kỳ kinh nguyệt: hiểu các giai đoạn mà không đóng khung bản thân / Understanding menstrual cycle phases</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#fbeef6"/><text x="60" y="76.0" font-size="29" fill="#843d67">Chu kỳ kinh nguyệt: hiểu các giai đoạn mà không đóng khung bản</text>
<text x="60" y="117.2" font-size="29" fill="#843d67">thân</text><text x="62" y="164" font-size="19" fill="#843d67">TÓM TẮT / SUMMARY • LM_WH_01 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#843d67">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Chu kỳ được tính từ ngày đầu kỳ kinh này đến</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">ngày đầu kỳ kế tiếp.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">A cycle runs from the first day of one period</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">to the first day of the next.</text><path d="M640 276v175" stroke="#843d67" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#843d67">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Ghi ngày bắt đầu, thời lượng, mức chảy máu và</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">triệu chứng theo cách dễ duy trì.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Record start dates, duration, bleeding and</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">symptoms in a sustainable way.</text><path d="M640 566v175" stroke="#843d67" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#843d67">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Năng lượng và tâm trạng có thể thay đổi nhưng</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">không giống nhau ở mọi người.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">Energy and mood patterns differ between people.</text><path d="M640 856v175" stroke="#843d67" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#843d67">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#843d67">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
