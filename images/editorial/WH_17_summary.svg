<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Tập sức mạnh cho nữ: xây thói quen lâu dài / Strength training for women</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#fbeef6"/><text x="60" y="76.0" font-size="29" fill="#843d67">Tập sức mạnh cho nữ: xây thói quen lâu dài</text><text x="62" y="164" font-size="19" fill="#843d67">TÓM TẮT / SUMMARY • WH_17 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#843d67">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Tập sức mạnh là một phần của vận động lành mạnh</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">ở người trưởng thành.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Strength training is part of healthy adult</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">activity.</text><path d="M640 276v175" stroke="#843d67" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#843d67">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Chọn bài phù hợp kinh nghiệm, học kỹ thuật và</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">để cơ thể hồi phục giữa các buổi nặng.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Choose suitable exercises, learn technique and</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">allow recovery between hard sessions.</text><path d="M640 566v175" stroke="#843d67" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#843d67">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Bằng chứng hiện tại không buộc phải dồn tập sức</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">mạnh vào một pha chu kỳ.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">Current evidence does not require concentrating</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">resistance training in one cycle phase.</text><path d="M640 856v175" stroke="#843d67" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#843d67">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#843d67">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
