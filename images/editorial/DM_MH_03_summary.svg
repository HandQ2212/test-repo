<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Lo âu khi quan hệ: bớt tự đánh giá, tăng giao tiếp / Sexual performance anxiety and communication</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#eef1fb"/><text x="60" y="76.0" font-size="29" fill="#364d83">Lo âu khi quan hệ: bớt tự đánh giá, tăng giao tiếp</text><text x="62" y="164" font-size="19" fill="#364d83">TÓM TẮT / SUMMARY • DM_MH_03 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#364d83">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Lo lắng, mệt mỏi và áp lực thể hiện có thể làm</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">khó hưng phấn hoặc duy trì cương.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Anxiety, fatigue and pressure to perform can</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">interfere with arousal or erections.</text><path d="M640 276v175" stroke="#364d83" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#364d83">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Thử thống nhất những buổi gần gũi không đặt mục</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">tiêu phải giao hợp hoặc cực khoái.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Consider intimacy without a requirement for</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">intercourse or orgasm.</text><path d="M640 566v175" stroke="#364d83" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#364d83">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">HRV thấp không xác định lo âu thực hiện hay độc</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">tính cortisol.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">Low HRV does not diagnose performance anxiety</text>
<text x="675" y="907.8" font-size="21" fill="#183c3b">or cortisol toxicity.</text><path d="M640 856v175" stroke="#364d83" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#364d83">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#364d83">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
