      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#fff3e3"/><text x="60" y="76.0" font-size="29" fill="#8a4c14">Active Zone Minutes: hiểu đúng phút vận động của Fitbit</text><text x="62" y="164" font-size="19" fill="#8a4c14">TÓM TẮT / SUMMARY • LM_AC_01 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#8a4c14">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Active Zone Minutes là cách Fitbit ghi nhận vận</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">động theo cường độ nhịp tim.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Fitbit Active Zone Minutes count activity using</text>
