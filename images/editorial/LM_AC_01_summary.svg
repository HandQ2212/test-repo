<text x="80" y="617.8" font-size="21" fill="#183c3b">hoạt động.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Review duration, perceived effort and activity</text>
<text x="675" y="617.8" font-size="21" fill="#183c3b">type together.</text><path d="M640 566v175" stroke="#8a4c14" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#8a4c14">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">AZM là tính năng sản phẩm, không phải đơn vị y</text>
