<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1200" width="1280" height="1200" role="img" aria-labelledby="title desc">
      <title id="title">Vận động trong thai kỳ: trao đổi trước và theo dõi dấu hiệu dừng / Exercise during pregnancy</title>
      <desc id="desc">Original editorial illustration. Not clinical data, an anatomical diagram or a reproduction of a study.</desc>
      <g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="1200" fill="#fbeef6"/><text x="60" y="76.0" font-size="29" fill="#843d67">Vận động trong thai kỳ: trao đổi trước và theo dõi dấu hiệu dừng</text><text x="62" y="164" font-size="19" fill="#843d67">TÓM TẮT / SUMMARY • WH_26 • 2026-10-26</text><rect x="50" y="210" width="1180" height="270" rx="22" fill="white"/><text x="78" y="252" font-size="23" font-weight="700" fill="#843d67">01 / Hiểu đúng · Understand</text><text x="80" y="298.0" font-size="21" fill="#183c3b">Nhiều người có thai kỳ không biến chứng có thể</text>
<text x="80" y="327.8" font-size="21" fill="#183c3b">vận động và nhận lợi ích.</text><text x="675" y="298.0" font-size="21" fill="#183c3b">Many people with uncomplicated pregnancies can</text>
<text x="675" y="327.8" font-size="21" fill="#183c3b">benefit from activity.</text><path d="M640 276v175" stroke="#843d67" opacity=".15"/><rect x="50" y="500" width="1180" height="270" rx="22" fill="white"/><text x="78" y="542" font-size="23" font-weight="700" fill="#843d67">02 / Thực hành · Try</text><text x="80" y="588.0" font-size="21" fill="#183c3b">Trao đổi trong khám thai về hoạt động đang làm</text>
<text x="80" y="617.8" font-size="21" fill="#183c3b">và các điều chỉnh cần thiết.</text><text x="675" y="588.0" font-size="21" fill="#183c3b">Discuss current activity at antenatal visits.</text><path d="M640 566v175" stroke="#843d67" opacity=".15"/><rect x="50" y="790" width="1180" height="270" rx="22" fill="white"/><text x="78" y="832" font-size="23" font-weight="700" fill="#843d67">03 / Giới hạn · Limits</text><text x="80" y="878.0" font-size="21" fill="#183c3b">Không có giới hạn 140 nhịp/phút áp dụng cho tất</text>
<text x="80" y="907.8" font-size="21" fill="#183c3b">cả.</text><text x="675" y="878.0" font-size="21" fill="#183c3b">There is no universal 140-bpm ceiling.</text><path d="M640 856v175" stroke="#843d67" opacity=".15"/><text x="65" y="1130" font-size="19" fill="#843d67">Minh họa biên tập; không phải dữ liệu đo hoặc hình nghiên cứu gốc.</text><text x="65" y="1165" font-size="18" fill="#843d67">Editorial summary; not measured data or a figure from a cited study. Read the full article for context.</text></g></svg>
